<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamu Sedang Offline - PMB YPIB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #F1F4F7; color: #0A1317; text-align: center; padding-top: 20%; margin: 0; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; margin-bottom: 20px; color: #646E87; }
        button { background-color: #0B41CB; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0936A9; }
    </style>
</head>
<body>
    <h1>Kamu sedang offline</h1>
    <p>Koneksi internetmu terputus. Silakan periksa jaringan dan coba lagi.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
</body>
</html>
